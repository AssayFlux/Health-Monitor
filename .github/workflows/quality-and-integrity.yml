name: Quality and integrity (tests 1–2)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  code-quality:
    name: "1 · Code quality"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python lint and test formatting
        run: |
          python -m pip install ruff
          ruff check --select E9,F app/src/main/python tests
          ruff format --check tests
      - name: Kotlin formatting debt notice
        run: echo 'Legacy Kotlin formatting is not enforced globally; Android lint/compile remains the correctness gate.'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools, platforms;android-36, build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13.2"
      - name: Android lint
        run: gradle :app:lintDebug --no-daemon
  cross-language-integrity:
    name: "2 · Kotlin/Python contract and calculation integrity"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Engine and JSON-boundary regression tests
        env:
          PYTHONPATH: app/src/main/python
        run: |
          python -m unittest discover -s tests/integrity -v
          python -m unittest discover -s tests/security -v
          python -m compileall -q app/src/main/python

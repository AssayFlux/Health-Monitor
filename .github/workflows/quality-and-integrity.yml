name: Quality and integrity (tests 1–2)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  code-quality:
    name: "1 · Code quality"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python lint and format
        run: |
          python -m pip install ruff
          ruff check app/src/main/python tests
          ruff format --check app/src/main/python tests
      - name: Kotlin formatting
        run: |
          curl -fsSLo ktlint https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint
          find app/src -type f -name '*.kt' -print0 | xargs -0 ./ktlint --relative
      - name: Android lint
        run: gradle :app:lintDebug --no-daemon
  cross-language-integrity:
    name: "2 · Kotlin/Python contract and calculation integrity"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Engine and JSON-boundary regression tests
        env:
          PYTHONPATH: app/src/main/python
        run: |
          python -m unittest discover -s tests/integrity -v
          python -m compileall -q app/src/main/python

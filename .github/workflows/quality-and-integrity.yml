name: Core quality, integrity and security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-validation:
    name: Code, Python, security and Android source validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation tools
        run: python -m pip install ruff bandit
      - name: Python lint and formatting
        run: |
          ruff check --select E9,F app/src/main/python tests
          ruff format --check tests
      - name: Python syntax validation
        run: python -m compileall -q app/src/main/python
      - name: Security scan
        run: bandit -r app/src/main/python -ll
      - name: Security regression tests
        env:
          PYTHONPATH: app/src/main/python
        run: python -m unittest discover -s tests/security -v
      - name: Cross-language data contract tests
        env:
          PYTHONPATH: app/src/main/python
        run: python -m unittest discover -s tests/integrity -v
      - name: Validate maintenance scripts
        run: bash -n scripts/*.sh
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Android lint and source compilation checks
        run: gradle :app:lintDebug --no-daemon

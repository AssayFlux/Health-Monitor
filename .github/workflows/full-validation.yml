name: Full validation (tests 3–5)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-regressions:
    name: "3 · Security and bug regression"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install security scanner
        run: python -m pip install bandit
      - name: Scan Python calculation and data-boundary code
        run: bandit -r app/src/main/python -ll
      - name: Run security regression tests
        env:
          PYTHONPATH: app/src/main/python
        run: python -m unittest discover -s tests/security -v

  improvement-audit:
    name: "4 · Improvement and maintainability audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install static-analysis tools
        run: python -m pip install ruff
      - name: Check Python runtime errors and undefined names
        run: ruff check --select E9,F app/src/main/python tests
      - name: Verify test formatting
        run: ruff format --check tests
      - name: Validate maintenance scripts
        run: bash -n scripts/*.sh
      - name: Compile Python modules
        run: python -m compileall -q app/src/main/python

  android-build-and-device-tests:
    name: "5 · Debug/release APK, AAB and Android tests"
    # Use the stable hosted image for emulator/ADB compatibility.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build and verify all APK/AAB variants
        run: bash scripts/build-artifacts.sh
      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: health-monitor-apk-aab
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Run Android instrumentation tests on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            set -euo pipefail
            adb start-server
            adb wait-for-device
            for attempt in $(seq 1 120); do
              state="$(adb get-state 2>/dev/null || true)"
              booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$state" = "device" ] && [ "$booted" = "1" ]; then
                break
              fi
              if [ "$attempt" -eq 120 ]; then
                echo "Emulator did not become ready (state=$state, boot_completed=$booted)"
                adb devices -l || true
                exit 1
              fi
              sleep 5
            done
            adb devices -l
            gradle :app:connectedDebugAndroidTest --no-daemon

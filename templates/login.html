<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in — Health Monitor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">
      {% if logo %}
        <img class="login-logo" src="{{ url_for('static', filename='uploads/' ~ logo) }}" alt="Logo">
      {% else %}
        <div class="brand-mark large">HM</div>
      {% endif %}
      <h1>{{ app_name }}</h1>
      <p class="hint">{{ app_tagline }}</p>
    </div>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}
        <div class="flash {{ cat }}">{{ m }}</div>
      {% endfor %}
    {% endwith %}

    {% if fp_available %}
    <button type="button" id="fpBtn" class="fingerprint-btn">
      Sign in with fingerprint
    </button>
    <div class="or">or</div>
    {% endif %}

    <form method="post" autocomplete="on">
      <input type="hidden" name="mode" value="password">
      <input type="password" name="password" placeholder="Password"
             required autocomplete="current-password">
      <button type="submit">Sign in</button>
    </form>
  </div>

<script>
(function(){
  var btn = document.getElementById('fpBtn');
  if (!btn) return;
  btn.addEventListener('click', function(){
    btn.disabled = true;
    btn.textContent = 'Waiting for fingerprint...';
    fetch('/login/fingerprint', {method:'POST'})
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){
        if (res.ok && res.j.ok) { window.location.href = '/'; return; }
        alert(res.j.error || 'Fingerprint failed.');
        btn.disabled = false;
        btn.textContent = 'Sign in with fingerprint';
      })
      .catch(function(e){
        alert('Error: ' + e.message);
        btn.disabled = false;
        btn.textContent = 'Sign in with fingerprint';
      });
  });
})();
</script>
</body>
</html>
